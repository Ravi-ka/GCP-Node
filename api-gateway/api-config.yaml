swagger: "2.0"
info:
  title: microservices-api
  description: Unified API Gateway for all services
  version: 1.0.0

schemes:
  - https
produces:
  - application/json

paths:
  /v1/order:
    post:
      operationId: createOrder
      x-google-backend:
        address: https://createorder-249260618583.asia-south1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        '200':
          description: OK

  /v1/payment:
    post:
      operationId: processPayment
      x-google-backend:
        address:  https://processpayment-249260618583.asia-south1.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        '200':
          description: OK
